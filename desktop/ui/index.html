<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mei-viewer</title>
    <link rel="icon" href="mei-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <img class="brand-logo" src="mei-logo.svg" width="48" height="48" alt="MeiLang" />
        <div>
          <h1>mei-viewer <span id="viewer-version" class="version-badge">…</span></h1>
          <p class="sub">默认工作区 · 导出 / 导入快照 · 打开其它工作区</p>
        </div>
      </header>

      <section class="status" id="status-panel">
        <div class="row"><span>版本</span><code id="status-version">—</code></div>
        <div class="row"><span>状态</span><strong id="status-text">未启动</strong></div>
        <div class="row"><span>端口</span><code id="status-port">—</code></div>
        <div class="row path-row">
          <span>当前工作区</span>
          <div class="path-value">
            <code id="status-workspace" class="path-code">—</code>
            <div class="path-actions">
              <button type="button" class="secondary compact" data-copy-path="status-workspace">复制路径</button>
              <button type="button" class="secondary compact" data-reveal-path="status-workspace">打开文件夹</button>
            </div>
          </div>
        </div>
        <div class="row path-row">
          <span>默认工作区</span>
          <div class="path-value">
            <code id="status-home" class="path-code">—</code>
            <div class="path-actions">
              <button type="button" class="secondary compact" data-copy-path="status-home">复制路径</button>
              <button type="button" class="secondary compact" data-reveal-path="status-home">打开文件夹</button>
            </div>
          </div>
        </div>
        <div class="row path-row">
          <span>日志文件</span>
          <div class="path-value">
            <code id="status-log" class="path-code">—</code>
            <div class="path-actions">
              <button type="button" class="secondary compact" data-copy-path="status-log">复制路径</button>
              <button type="button" class="secondary compact" data-reveal-path="status-log">打开文件夹</button>
            </div>
          </div>
        </div>
        <details class="logs-fold" id="logs-fold">
          <summary>运行日志（点击展开）</summary>
          <div class="logs-body">
            <div class="logs-actions">
              <label class="follow">
                <input type="checkbox" id="log-follow" checked />
                自动刷新
              </label>
              <button type="button" id="btn-copy-log" class="secondary compact">复制全部</button>
              <button type="button" id="btn-reveal-log" class="secondary compact">在访达中显示文件</button>
            </div>
            <pre id="log-view" class="log-view" tabindex="0" aria-live="polite">（尚未启动 host）</pre>
          </div>
        </details>
      </section>

      <section class="actions">
        <button type="button" id="btn-start-home">打开默认工作区</button>
        <button type="button" id="btn-open-workspace" class="secondary">打开其它工作区…</button>
        <button type="button" id="btn-import-snapshot" title="无需先打开工作区：始终合并到默认工作区并启动">导入快照到默认工作区…</button>
        <div class="export-row">
          <label class="export-app">
            <span>导出 apps（可多选）</span>
            <select id="export-app" multiple size="4" disabled>
              <option value="">（未打开工作区）</option>
            </select>
          </label>
          <label class="follow">
            <input type="checkbox" id="export-include-data" checked />
            可移植包（含数据/配置，推荐）
          </label>
          <label class="follow">
            <input type="checkbox" id="export-include-media" />
            包含大媒体（视频等 upload）
          </label>
        </div>
        <button type="button" id="btn-export-snapshot" disabled>导出快照…</button>
        <button type="button" id="btn-open-host" disabled>在浏览器打开宿主</button>
        <button type="button" id="btn-stop" class="secondary" disabled>停止</button>
      </section>

      <section class="recent">
        <h2>我打开的工作区位置</h2>
        <ul id="recent-list"></ul>
      </section>

      <p class="hint" id="hint"></p>
    </main>

    <div id="startup-overlay" class="startup-overlay hidden" aria-live="polite" aria-busy="true">
      <div class="startup-card">
        <h2 id="startup-title">正在启动</h2>
        <p id="startup-label">请稍候…</p>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="startup-bar" class="progress-bar" style="width: 4%"></div>
        </div>
      </div>
    </div>

    <script src="/main.js"></script>
  </body>
</html>
