api_version = "mei-admin-resource-v1"

[[resources]]
resource_id = "organization"
title = "单位信息"
description = "业主单位基础信息"
template = "singleton-form"
provider = "config-record"
record_path = "admin/data/organization.json"
required_capabilities = ["config_upload"]
scope = "app"
revision_policy = "optimistic"
dirty_policy = "block-leave"
audit = true

[resources.navigation]
menu = "管理"
order = 10
keywords = ["单位", "组织"]

[[resources.sections]]
id = "basic"
title = "基本信息"

[[resources.sections.fields]]
id = "name"
label = "单位名称"
control = "text"
required = true

[[resources.sections.fields]]
id = "contact"
label = "联系人"
control = "text"
required = false

[[resources]]
resource_id = "datasources"
title = "数据源"
description = "可替换数据源槽位"
template = "asset-slot-collection"
provider = "asset-slot"
required_capabilities = ["config_upload"]
scope = "app"
revision_policy = "optimistic"
audit = true
danger_level = "elevated"

[resources.navigation]
menu = "管理"
order = 20
keywords = ["数据源", "上传"]

[[resources.columns]]
id = "slot_id"
label = "槽位"
control = "text"

[[resources.columns]]
id = "status"
label = "状态"
control = "text"

[resources.upload]
accept = [".xlsx", ".parquet"]
max_bytes = 52428800
replace_modes = ["hard", "soft"]
retain_versions = true
schema_ref = "admin/schemas/datasource-slot.json"
requires_review = false

[[resources.actions]]
id = "import"
label = "导入"
provider = "command-job"
method = "run"
danger_level = "elevated"
