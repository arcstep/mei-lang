name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Check release versions and provenance
        id: meta
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          node scripts/release/sync-versions.mjs --check
          npm run release:test
          VERSION="$(node scripts/release/sync-versions.mjs --print-version)"
          TAG=""
          CHANNEL="dry-run"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "${VERSION}" == *-* ]]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
            if [[ "${TAG}" != "v${VERSION}" ]]; then
              echo "::error::tag ${TAG} must exactly match Cargo.toml version v${VERSION}"
              exit 1
            fi
            git fetch --no-tags origin \
              "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
              echo "::error::release tag commit must be reachable from ${DEFAULT_BRANCH}"
              exit 1
            fi
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "channel=${CHANNEL}" >> "${GITHUB_OUTPUT}"

  viewer:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            id: macos-arm64
          - runner: macos-15-intel
            id: macos-x64
          - runner: windows-latest
            id: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Collect release sidecars
        shell: bash
        env:
          # Prefer Martin source build in CI so TARGET matrix is not opaque-bin only.
          # mbtiles-only: skip webui (needs npm). Required on macos-x64 (no official prebuilt).
          MEI_MARTIN_FROM_SOURCE: "1"
          MEI_MARTIN_FEATURES: mbtiles
        run: ./scripts/desktop/collect-desktop-sidecars.sh --release
      - name: Smoke desktop sidecars
        shell: bash
        run: ./scripts/desktop/smoke-desktop-sidecars.sh
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build and package Viewer
        working-directory: desktop
        run: npm run build
      - name: Check Viewer release metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find desktop/dist -maxdepth 1 -type f -name 'mei-viewer-*' ! -name '*.manifest.json' -print -quit)"
          test -n "$(find desktop/dist -maxdepth 1 -type f -name 'mei-viewer-*.manifest.json' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-viewer-${{ matrix.id }}
          path: |
            desktop/dist/mei-viewer-*.zip
            desktop/dist/mei-viewer-*-setup.exe
            desktop/dist/mei-viewer-*.manifest.json
          if-no-files-found: error

  bundles:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            id: linux-x64
          - runner: macos-15
            id: macos-arm64
          - runner: macos-15-intel
            id: macos-x64
          - runner: windows-latest
            id: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Package Runtime and Toolchain
        shell: bash
        env:
          MEI_MARTIN_FROM_SOURCE: "1"
          MEI_MARTIN_FEATURES: mbtiles
        run: ./scripts/release/package-release-bundles.sh
      - name: Verify Runtime artifact has no libduckdb
        shell: bash
        run: |
          set -euo pipefail
          if find dist/bundles -type f \( -name 'libduckdb*' -o -name 'duckdb.dll' \) | grep -q .; then
            echo "error: release bundles must not contain libduckdb" >&2
            find dist/bundles -type f \( -name 'libduckdb*' -o -name 'duckdb.dll' \) >&2
            exit 1
          fi
          echo "ok: Runtime/Toolchain bundles are Rust-only for query path"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundles-${{ matrix.id }}
          path: |
            dist/bundles/mei-runtime-*
            dist/bundles/mei-toolchain-*
          if-no-files-found: error

  vscode:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/mei-lang-vscode/package-lock.json
      - name: Install locked extension dependencies
        working-directory: extensions/mei-lang-vscode
        run: npm ci
      - name: Package VSIX
        working-directory: extensions/mei-lang-vscode
        run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-vscode
          path: extensions/mei-lang-vscode/mei-lang-*.vsix
          if-no-files-found: error

  sbom:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Ensure SBOM output directory
        run: mkdir -p dist/sbom
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom/mei-lang-${{ needs.meta.outputs.version }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: dist/sbom/mei-lang-*.spdx.json
          if-no-files-found: error

  assemble:
    needs:
      - meta
      - viewer
      - bundles
      - vscode
      - sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Generate and verify release contract
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          node scripts/release/generate-release-manifest.mjs \
            --assets-dir dist/release \
            --version "${VERSION}" \
            --git-sha "${GITHUB_SHA}" \
            --tag "${RELEASE_TAG}" \
            --channel "${RELEASE_CHANNEL}"
          node scripts/release/verify-release.mjs --assets-dir dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ needs.meta.outputs.version }}-${{ github.run_id }}
          path: dist/release/*
          if-no-files-found: error
      - name: Attest release assets
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.exe
            dist/release/*.vsix
            dist/release/*.spdx.json
      - name: Refuse to overwrite a published release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::release ${RELEASE_TAG} already exists; published versions are immutable"
            exit 1
          fi
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: MeiLang ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.channel == 'beta' }}
          make_latest: ${{ needs.meta.outputs.channel == 'stable' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/release/*
          body: |
            Automated MeiLang release.

            Assets:
            - Viewer installers for Windows x64 and macOS arm64/x64
            - Runtime and Toolchain bundles for Windows, macOS and Linux x64
            - VS Code extension
            - Release manifest, SHA-256 checksums and SPDX SBOM

            Platform code signing is not configured yet. Verify SHA256SUMS.txt
            and the GitHub artifact attestations before installation.
