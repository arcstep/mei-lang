name: Release

# Build and publish GitHub Release assets:
#   - mei-viewer (macOS zip, Windows NSIS setup)
#   - mei-toolchain archives (linux / macOS / Windows)
#   - VS Code extension .vsix
#
# Trigger:
#   - push tag v*          → publish release for that tag
#   - workflow_dispatch    → draft release (optional tag override)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.5.19). Empty = v{Cargo.toml version}."
        required: false
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version / tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VER="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p;}' Cargo.toml | head -1)"
          if [[ -z "${CARGO_VER}" ]]; then
            echo "::error::could not read workspace version from Cargo.toml"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            DRAFT="false"
          else
            TAG_INPUT="${{ inputs.tag }}"
            if [[ -n "${TAG_INPUT}" ]]; then
              TAG="${TAG_INPUT}"
            else
              TAG="v${CARGO_VER}"
            fi
            DRAFT="${{ inputs.draft }}"
            DRAFT="${DRAFT:-true}"
          fi

          TAG_VER="${TAG#v}"
          if [[ "${TAG_VER}" != "${CARGO_VER}" ]]; then
            if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
              echo "::error::tag ${TAG} does not match Cargo.toml version ${CARGO_VER}. Bump versions before tagging."
              exit 1
            fi
            echo "::warning::requested tag ${TAG} differs from Cargo.toml (${CARGO_VER}); artifacts use Cargo.toml version"
          fi

          echo "version=${CARGO_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${CARGO_VER} tag=${TAG} draft=${DRAFT}"

  viewer-macos:
    needs: meta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root asset deps
        run: npm ci || npm install
      - name: Collect sidecars (release)
        run: ./scripts/collect-desktop-sidecars.sh --release
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci || npm install
      - name: Build + versioned package
        working-directory: desktop
        run: npm run build
      - name: Upload viewer macOS
        uses: actions/upload-artifact@v4
        with:
          name: release-viewer-macos
          path: |
            desktop/dist/mei-viewer-*.zip
            desktop/dist/MANIFEST.json
          if-no-files-found: error

  viewer-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root asset deps
        shell: bash
        run: npm ci || npm install
      - name: Collect sidecars (release)
        shell: bash
        run: ./scripts/collect-desktop-sidecars.sh --release
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci || npm install
      - name: Build + versioned package
        working-directory: desktop
        run: npm run build
      - name: Upload viewer Windows
        uses: actions/upload-artifact@v4
        with:
          name: release-viewer-windows
          path: |
            desktop/dist/mei-viewer-*-setup.exe
            desktop/dist/MANIFEST.json
          if-no-files-found: error

  toolchain-linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package toolchain
        run: |
          chmod +x ./scripts/package-toolchain-release.sh
          ./scripts/package-toolchain-release.sh
      - name: Upload toolchain linux
        uses: actions/upload-artifact@v4
        with:
          name: release-toolchain-linux
          path: |
            dist/toolchain/mei-toolchain-*.tar.gz
            dist/toolchain/MANIFEST.json
          if-no-files-found: error

  toolchain-macos:
    needs: meta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package toolchain
        run: |
          chmod +x ./scripts/package-toolchain-release.sh
          ./scripts/package-toolchain-release.sh
      - name: Upload toolchain macOS
        uses: actions/upload-artifact@v4
        with:
          name: release-toolchain-macos
          path: |
            dist/toolchain/mei-toolchain-*.tar.gz
            dist/toolchain/MANIFEST.json
          if-no-files-found: error

  toolchain-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package toolchain
        shell: bash
        run: |
          chmod +x ./scripts/package-toolchain-release.sh
          ./scripts/package-toolchain-release.sh
      - name: Upload toolchain Windows
        uses: actions/upload-artifact@v4
        with:
          name: release-toolchain-windows
          path: |
            dist/toolchain/mei-toolchain-*.zip
            dist/toolchain/MANIFEST.json
          if-no-files-found: error

  vscode:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install extension deps + package VSIX
        working-directory: extensions/mei-lang-vscode
        run: |
          npm install
          npm run package
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: release-vscode
          path: extensions/mei-lang-vscode/mei-lang-*.vsix
          if-no-files-found: error

  publish:
    needs:
      - meta
      - viewer-macos
      - viewer-windows
      - toolchain-linux
      - toolchain-macos
      - toolchain-windows
      - vscode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: false

      - name: Flatten assets + checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          # Collect files; keep unique basenames (viewer manifests would collide).
          find release-assets -type f | while read -r f; do
            base="$(basename "$f")"
            parent="$(basename "$(dirname "$f")")"
            case "$base" in
              MANIFEST.json)
                cp -f "$f" "dist/release/${parent}-MANIFEST.json"
                ;;
              *)
                cp -f "$f" "dist/release/${base}"
                ;;
            esac
          done
          (
            cd dist/release
            sha256sum * > SHA256SUMS.txt
          )
          echo "Listing dist/release:"
          ls -la dist/release
          {
            echo "files<<EOF"
            find dist/release -type f -print
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: mei-lang ${{ needs.meta.outputs.version }}
          draft: ${{ needs.meta.outputs.draft == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/release/*
          body: |
            ## mei-lang ${{ needs.meta.outputs.version }}

            ### 产物

            | 组件 | 文件 |
            |---|---|
            | **mei-viewer** (macOS) | `mei-viewer-*-apple-darwin.zip` |
            | **mei-viewer** (Windows) | `mei-viewer-*-setup.exe` |
            | **Toolchain** (host-shell / compiler / runtime / lsp …) | `mei-toolchain-*.tar.gz` / `.zip` |
            | **VS Code 扩展** | `mei-lang-*.vsix` |
            | 校验 | `SHA256SUMS.txt` |

            ### 使用提示

            - **Viewer**：解压/安装后打开含 `workspace.json` 的工作区目录。
            - **Toolchain**：解压后将 `bin/` 加入 `PATH`，或按工作区 `deploy/install.sh --from release` 约定放置。
            - **编辑器**：`code --install-extension mei-lang-*.vsix`；LSP 二进制见 toolchain 包中的 `mei-lsp`（扩展设置 `mei.lsp.path`）。

            > 本仓库公开 CI / Release **不依赖** 私有 sibling workspaces。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
