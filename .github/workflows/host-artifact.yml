name: Host Artifact

on:
  push:
    paths:
      - 'host-shell/**'
      - 'crates/mei-host-graph/**'
      - 'app/assets/spa-navigation/**'
      - 'scripts/test-artifact-*.mjs'
      - 'scripts/host-perf-sample.mjs'
      - 'e2e/artifact-navigation.spec.mjs'
      - 'e2e/view-revision-assemble.spec.mjs'
      - '.github/workflows/host-artifact.yml'
  pull_request:
    paths:
      - 'host-shell/**'
      - 'crates/mei-host-graph/**'
      - 'app/assets/**'
      - 'scripts/**'
      - 'e2e/**'

jobs:
  artifact-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root npm deps
        run: npm ci || npm install

      - name: Build mei-host-shell (0 warning gate)
        run: |
          set -euo pipefail
          command -v rg >/dev/null || sudo apt-get install -y ripgrep
          cargo build -p mei-host-shell 2>&1 | tee build.log
          if rg "warning:" build.log; then
            echo "::error::mei-host-shell build emitted rustc warnings"
            exit 1
          fi

      - name: Rust artifact tests
        # cargo test accepts a single substring TESTNAME filter per invocation.
        run: |
          set -euo pipefail
          cargo test -p mei-host-graph manifest_revision_digest
          cargo test -p mei-host-graph session_overlay
          cargo test -p mei-host-graph view_revision
          cargo test -p mei-host-shell scene_manifest
          cargo test -p mei-host-shell artifact_observability

      - name: Build JS bundles
        run: npm run assets:build

      - name: JS artifact static gates
        run: npm run test:artifact-static
