name: Layout Policy

# Standalone mei-lang CI only. Must NOT require sibling workspaces/ws-demo-v2
# (private demo profile; never published to GitHub). Local monorepo integration
# tests that need that tree must skip when absent — they are not CI gates.

on:
  push:
    paths:
      - "crates/kernel/src/compile/layout_budget/**"
      - "crates/mei-host-graph/src/theme_layout_merge.rs"
      - "crates/mei-host-graph/src/assemble.rs"
      - "crates/mei-host-graph/src/artifact_biz_macros.rs"
      - "crates/kernel/src/model/profile_layout_policy.rs"
      - ".github/workflows/layout-policy.yml"
  pull_request:
    paths:
      - "crates/kernel/**"
      - "crates/mei-host-graph/**"
      - ".github/workflows/layout-policy.yml"

jobs:
  layout-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbid sibling-workspace paths in GitHub Actions
        run: |
          if rg -n 'workspaces/ws-demo-v2|\.\./workspaces/' .github/workflows; then
            echo "::error::mei-lang GitHub Actions must not reference private sibling workspaces (ws-demo-v2 is not on GitHub)"
            exit 1
          fi
          if rg -n '\.expect\("ws-demo|\.expect\("workspaces/ws-|\.expect\("ws-spbjw' \
              crates host-shell mei-compiler; then
            echo "::error::hard .expect on sibling workspaces is forbidden"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build mei-lang-server (0 warning gate)
        run: cargo build -p mei-lang-server 2>&1 | tee build.log && ! rg "warning:" build.log

      - name: Kernel layout_policy unit tests (self-contained)
        run: cargo test -p mei-lang-kernel layout_policy author_
