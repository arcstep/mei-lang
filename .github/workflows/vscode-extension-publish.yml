# Publish MeiLang VS Code extension to Open VSX (manual).
# Requires repository secret OVSX_PAT. Does not run on push.
# Must stay self-contained inside mei-lang (no sibling workspaces/).

name: vscode-extension-publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only; skip ovsx publish"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/mei-lang-vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and package
        run: |
          npm ci
          npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mei-lang-vsix
          path: extensions/mei-lang-vscode/mei-lang-*.vsix

      - name: Publish to Open VSX
        if: ${{ inputs.dry_run == false }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret is required for publish" >&2
            exit 1
          fi
          npx --yes ovsx publish ./mei-lang-*.vsix -p "$OVSX_PAT"
