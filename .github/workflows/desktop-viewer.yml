name: desktop-viewer

# Heavy Viewer packaging: run only on explicit instruction (not on every push/PR).
# Formal multi-product releases use release.yml (v* tag or workflow_dispatch).
on:
  workflow_dispatch:

jobs:
  viewer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            id: macos-arm64
          - runner: macos-15-intel
            id: macos-x64
            # Martin v1.10.1 ships no x86_64-apple-darwin prebuilt; compile mbtiles-only.
            martin_from_source: "1"
          - runner: windows-latest
            id: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked root dependencies
        run: npm ci
      - name: Collect sidecars (release)
        shell: bash
        env:
          MEI_MARTIN_FEATURES: mbtiles
          MEI_MARTIN_FROM_SOURCE: ${{ matrix.martin_from_source || '0' }}
        run: ./scripts/desktop/collect-desktop-sidecars.sh --release
      - name: Smoke desktop sidecars
        shell: bash
        run: ./scripts/desktop/smoke-desktop-sidecars.sh
      - name: Install locked desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build + versioned package
        working-directory: desktop
        run: npm run build
      - name: Read dist version
        id: meta
        working-directory: desktop
        shell: bash
        run: |
          VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/MANIFEST.json','utf8')).version)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "artifact=mei-viewer-${VER}-${{ matrix.id }}" >> "$GITHUB_OUTPUT"
      - name: Upload Viewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            desktop/dist/mei-viewer-*.zip
            desktop/dist/mei-viewer-*-setup.exe
            desktop/dist/mei-viewer-*.manifest.json
            desktop/dist/MANIFEST.json
          if-no-files-found: error
