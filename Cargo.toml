[workspace]
members = [
  "app",
  "crates/datasets",
  "crates/kernel",
  "crates/lsp",
  "crates/toolchain",
  "crates/ws-spbjw-integration-tests",
  "mei-compiler/compiler",
  "mei-compiler/crates/mei-bundle",
  "mei-compiler/crates/mei-compiler-tests",
  "mei-compiler/crates/mei-graph",
  "mei-compiler/crates/mei-lower",
  "mei-compiler/crates/mei-surface",
  "mei-compiler/crates/mei-syntax",
  "crates/mei-host-core",
  "crates/mei-host-graph",
  "crates/mei-host-auth",
  "crates/mei-plug-ds",
  "crates/mei-app-runtime",
  "host-shell",
  "server",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "2.5.10"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
calamine = "0.26"
axum = { version = "0.7", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
leptos = { version = "0.8", features = ["ssr"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower-lsp = "0.20"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
arrow-array = "53"
arrow-schema = "53"
parquet = "53"
chumsky = "0.9"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
