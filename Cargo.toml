[workspace]
members = [
  "app",
  "crates/datasets",
  "crates/kernel",
  "crates/lsp",
  "crates/toolchain",
  "crates/ws-spbjw-integration-tests",
  "server",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.1.3"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
calamine = "0.26"
axum = { version = "0.7", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
leptos = { version = "0.8", features = ["ssr"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starlark = "0.13.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower-lsp = "0.20"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
arrow-array = "53"
arrow-schema = "53"
parquet = "53"
