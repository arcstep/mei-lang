[workspace]
members = [
  "host-shell/app",
  "crates/datasets",
  "crates/kernel",
  "crates/lsp",
  "crates/toolchain",
  "mei-compiler/compiler",
  "mei-compiler/crates/mei-bundle",
  "mei-compiler/crates/mei-compiler-tests",
  "mei-compiler/crates/mei-graph",
  "mei-compiler/crates/mei-lower",
  "mei-compiler/crates/mei-surface",
  "mei-compiler/crates/mei-syntax",
  "crates/mei-host-core",
  "crates/mei-host-graph",
  "crates/mei-host-auth",
  "crates/mei-plug-ds",
  "crates/mei-app-runtime",
  "crates/mei-snapshot",
  "crates/mei-test-support",
  "host-shell",
  "server",
]
resolver = "2"

# Tauri Viewer keeps its own Cargo.toml / lockfile under desktop/src-tauri.
exclude = ["desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "2.7.8"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
calamine = "0.26"
axum = { version = "0.7", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
leptos = { version = "0.8", features = ["ssr"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4.1.0"
moka = { version = "0.12.15", features = ["sync"] }
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tower-lsp = "0.20"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
arrow-array = "54"
arrow-schema = "54"
parquet = "54"
chumsky = "0.9"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
[profile.dev]
# Line tables retain useful source locations while avoiding macOS' very large
# full-DWARF development artifacts.
debug = 1
