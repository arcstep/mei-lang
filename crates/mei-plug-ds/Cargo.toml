[package]
name = "mei-plug-ds"
version.workspace = true
edition.workspace = true
license.workspace = true

# Optional diagnostics CLI only — not part of product distribution.
# DS HTTP is embedded via mei-app-runtime (`mei_plug_ds::http_router`).
[[bin]]
name = "mei-plug-ds"
path = "src/bin/main.rs"
required-features = ["standalone-bin"]

[features]
default = []
standalone-bin = []

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
mei-host-core = { path = "../mei-host-core" }
mei-host-graph = { path = "../mei-host-graph" }
mei-lang-datasets = { path = "../datasets" }
mei-lang-kernel = { path = "../kernel" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
mei-test-support = { path = "../mei-test-support" }
