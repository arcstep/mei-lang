[package]
name = "mei-host-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "mei-host-shell"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-stream = "0.3"
axum.workspace = true
clap.workspace = true
mei-host-auth = { path = "../crates/mei-host-auth" }
mei-host-core = { path = "../crates/mei-host-core" }
mei-host-graph = { path = "../crates/mei-host-graph" }
mei-lang-app = { path = "app" }
mei-lang-kernel = { path = "../crates/kernel" }
mei-snapshot = { path = "../crates/mei-snapshot" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
http-body-util = "0.1"
http-body = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
