[package]
name = "mei-host-shell"
version = "2.0.2"
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "mei-host-shell"
path = "src/main.rs"

[features]
default = ["ds"]
ds = ["dep:mei-plug-ds"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
mei-bundle = { path = "../mei-compiler/crates/mei-bundle" }
mei-graph = { path = "../mei-compiler/crates/mei-graph" }
mei-host-core = { path = "../crates/mei-host-core" }
mei-host-graph = { path = "../crates/mei-host-graph" }
mei-lang-app = { path = "../app" }
mei-lang-kernel = { path = "../crates/kernel" }
mei-lang-toolchain = { path = "../crates/toolchain" }
mei-plug-ds = { path = "../crates/mei-plug-ds", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
http-body-util = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
