[package]
name = "mei-lang-server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "mei"
path = "src/main.rs"

[[bin]]
name = "mei-toolchain"
path = "src/bin/mei-toolchain.rs"

[[bin]]
name = "mei-host-web"
path = "src/bin/mei-host-web.rs"

[dependencies]
anyhow.workspace = true
async-stream = "0.3"
axum.workspace = true
http-body-util = "0.1"
base64 = "0.22"
calamine.workspace = true
chrono = "0.4.44"
clap.workspace = true
csv.workspace = true
dotenvy = "0.15"
mei-lang-app = { path = "../app" }
mei-lang-datasets = { path = "../crates/datasets" }
mei-lang-kernel = { path = "../crates/kernel" }
mei-lang-toolchain = { path = "../crates/toolchain" }
mei-host-auth = { path = "../crates/mei-host-auth" }
mei-host-core = { path = "../crates/mei-host-core" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
